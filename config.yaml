audio:
  model_sample_rate: 16000
  hop_length: 160                        # number of samples to shift  |  16000 / 160: 100 per second
  n_fft: 640                             # number of samples per fft (window size)
  mfcc_depth: 80

model:
  d_model: 512
  num_heads: 8
  dropout: 0.1
  max_source_length: 15                  # seconds | max: 3496 / 100 per sec = 34.96s
  max_target_length: 200                 #         | max: 86
  max_vocab_size: 10000
  num_encoder_layers: 8
  num_decoder_layers: 4
  batch_size: 16

training:
  num_epochs: 20
  lr: 1e-3
  lr_gamma: 0.9995
  lr_min: 1e-7
  weight_decay: 1e-2
  num_warmup_steps: 500
  cooldown: 2                            # seconds every step, null or 0 = no cooldown
  splits_train:
  - commonvoice-dev
  - dev-clean
  splits_test:
  - test-clean
  subset: null                           # null = all
  checkpoint_path: null                  # null = don't use
  reset_lr: true

output:
  output_every_num_steps: 5
  checkpoint_after_epoch: 1
  tests_per_epoch: 10
  num_samples_to_output: 4
